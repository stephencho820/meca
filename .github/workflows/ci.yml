name: Build MECA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap Supabase auth stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create table auth.users(id uuid primary key);
          create role anon;
          create role authenticated;
          create role service_role;
          create function auth.uid() returns uuid language sql stable as $$select null::uuid$$;
          SQL
      - name: Validate schema and booking transaction
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000000_initial_meca.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020080000_booking_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020180000_customer_management.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020195000_kakao_notification_outbox.sql
          psql -v ON_ERROR_STOP=1 -f tests/migration-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase2-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase3-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase4-smoke.sql
