name: Build MECA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap Supabase auth stubs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create table auth.users(id uuid primary key);
          create role anon;
          create role authenticated;
          create role service_role;
          create function auth.uid() returns uuid language sql stable as $$select null::uuid$$;
          SQL
      - name: Validate schema and booking transaction
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000000_initial_meca.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020080000_booking_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020180000_customer_management.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020195000_kakao_notification_outbox.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020200000_workshop_operations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020215000_customers_vehicles_crm.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021010000_work_resources.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021020000_public_booking_throttle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021030000_privacy_requests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021230000_pilot_invites.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021240000_owner_email_alerts.sql
          psql -v ON_ERROR_STOP=1 -f tests/migration-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase2-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase3-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase4-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase5-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase6-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase7-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase8-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase9-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/full-shop-acceptance.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase11-pilot-smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/phase12-owner-email-smoke.sql

  browser_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application
        run: npm install --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: End-to-end demo booking and admin tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: meca-playwright-traces
          path: test-results/
          retention-days: 7
